user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Upstream: backend Node.js ──────────────────────────────
    upstream backend {
        server backend:3000;
        keepalive 32;
    }

    server {
        listen       80;
        listen  [::]:80;
        server_name  _;

        root  /usr/share/nginx/html;
        index index.html;

        # ── Headers de segurança ──────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"      always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # ── Healthcheck do NGINX — stub local, sem proxy ──────
        # O healthcheck do Docker aponta para este endpoint.
        # Responde 200 imediatamente; não depende do backend.
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ── Proxy para a API backend ───────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection       "";

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;

            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # ── Proxy para /health do backend (opcional, para clientes externos) ──
        location = /health {
            proxy_pass         http://backend/health;
            proxy_set_header   Host $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout    5s;
            access_log off;
        }

        # ── Arquivos estáticos: cache longo (imagens, fontes) ──
        location ~* \.(woff2?|ttf|eot|ico|png|jpg|jpeg|gif|webp)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── JS e CSS: sem cache — garante que o browser sempre busca a versão atual
        location ~* \.(css|js)$ {
            expires    -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            access_log off;
        }

        # ── SPA fallback ───────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Bloqueia arquivos sensíveis ────────────────────────
        location ~* (\.env|\.git|package\.json|node_modules) {
            deny all;
            return 404;
        }
    }
}
