# =============================================================================
# devops-site — Docker Compose
#
# Serviços:
#   mysql    — MySQL 8.4 (init automático via db/init.sql)
#   backend  — Node.js/Express, porta 3000 (interna)
#   frontend — NGINX, porta 80 (pública)
#
# Pré-requisito:
#   Copie backend/.env.example para backend/.env e preencha os valores.
#   O MySQL usa as mesmas variáveis DB_USER / DB_PASSWORD do .env.
#
# Uso:
#   docker compose up -d --build
#
# Acesso:
#   http://localhost      → site
#   http://localhost/api  → API (via proxy NGINX)
# =============================================================================

services:

  # ── MySQL ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: devops-site-mysql
    env_file:
      - ./backend/.env           # lê DB_USER, DB_PASSWORD, DB_NAME do .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${DB_NAME}
      MYSQL_USER:          ${DB_USER}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    # Porta 3306 não é exposta para o host — o backend acessa pelo nome
    # de serviço "mysql" dentro da rede interna devops-net.
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - devops-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1",
             "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Backend (Node.js) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: devops-site-backend:latest
    container_name: devops-site-backend
    expose:
      - "3000"
    env_file:
      - ./backend/.env           # todas as variáveis vêm do .env
    environment:
      DB_HOST: mysql             # sobrescreve apenas o host, que é o nome do serviço Docker
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - devops-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Frontend (NGINX) ───────────────────────────────────────────────────────
  frontend:
    image: nginx:1.27-alpine
    container_name: devops-site-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - devops-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local

# ─── Rede ─────────────────────────────────────────────────────────────────────
networks:
  devops-net:
    driver: bridge
